# XcodeGen spec for the Budget iOS app.
# Generate the Xcode project with:  cd ios && xcodegen generate
name: BudgetApp
options:
  bundleIdPrefix: com.example.personalbudget
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BudgetApp:
    type: application
    platform: iOS
    sources:
      - path: BudgetApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.personalbudget.app
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Budget
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  BudgetAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BudgetAppTests
    dependencies:
      - target: BudgetApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.personalbudget.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BudgetApp.app/BudgetApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  BudgetApp:
    build:
      targets:
        BudgetApp: all
        BudgetAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BudgetAppTests
